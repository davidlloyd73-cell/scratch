<title>Lloyd Morning Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a living sky header (real sun, moon and weather for Harrow), a status strip, then colour-coded sections: Markets, Sky and day, Practice, Technology, Pause, System. */
:root{--bg:#eef2f9;--panel:#ffffff;--fg:#111a33;--muted:#5a6684;--line:#dbe2f0;--grid:#e6ebf5;
--ink:#111a33;--ok:#13803f;--warn:#b45309;--bad:#c0262d;--up:#0f9d58;--dn:#d93a3a;
--c-mark:#4f46e5;--c-sky:#0284c7;--c-prac:#0d9488;--c-tech:#7c3aed;--c-rest:#e8590c;--c-sys:#475569;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
--shadow:0 1px 2px rgba(17,26,51,.06),0 8px 24px rgba(17,26,51,.07);--r:16px;
--display:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1f;--panel:#121a31;--fg:#e8edfa;--muted:#9aa7c7;--line:#233055;--grid:#1c2748;
--ink:#e8edfa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--up:#34d399;--dn:#f87171;
--c-mark:#8b84ff;--c-sky:#38bdf8;--c-prac:#2dd4bf;--c-tech:#b196ff;--c-rest:#ff9a62;--c-sys:#94a3b8;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f1f;--panel:#121a31;--fg:#e8edfa;--muted:#9aa7c7;--line:#233055;--grid:#1c2748;
--ink:#e8edfa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--up:#34d399;--dn:#f87171;
--c-mark:#8b84ff;--c-sky:#38bdf8;--c-prac:#2dd4bf;--c-tech:#b196ff;--c-rest:#ff9a62;--c-sys:#94a3b8;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);margin:0;padding-block:14px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
a{color:var(--c-prac)}
.banner{border:1px dashed var(--c-tech);color:var(--c-tech);border-radius:12px;padding:8px 12px;font-size:13px}

/* ---- sky header ---- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 24px 20px;color:var(--hf);isolation:isolate;box-shadow:var(--shadow);--hf:#0d2b4a;--hm:#2c4a6b}
.hero.day{background:linear-gradient(165deg,#7fd1ff 0%,#bfe7ff 48%,#f6fbff 100%)}
.hero.dawn{background:linear-gradient(165deg,#ff9fb0 0%,#ffc79a 45%,#ffe9c9 100%);--hf:#3a1d2e;--hm:#6b3b4d}
.hero.dusk{background:linear-gradient(165deg,#3b2a78 0%,#c2557a 55%,#ff9f6e 100%);--hf:#fff;--hm:#ffe3d6}
.hero.night{background:linear-gradient(165deg,#070b1c 0%,#16205a 55%,#2a2f78 100%);--hf:#f4f6ff;--hm:#b9c3f0}
.hero .sky{position:absolute;inset:0;z-index:-1;pointer-events:none}
.cloud{position:absolute;border-radius:60px;background:rgba(255,255,255,.7);filter:blur(1px);animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:46%;height:150%;left:14%;top:-70%}.cloud::after{width:34%;height:120%;right:16%;top:-45%}
.hero.night .cloud,.hero.dusk .cloud{background:rgba(255,255,255,.14)}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.85;animation:twinkle 3.2s ease-in-out infinite}
.hero.day .star,.hero.dawn .star{display:none}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:center}
.hello{font:700 clamp(28px,5vw,44px)/1.05 var(--display);letter-spacing:-.01em;text-wrap:balance}
.date{margin-top:6px;color:var(--hm);font-weight:600;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.55);color:#10223d;backdrop-filter:blur(6px)}
.hero.night .chip,.hero.dusk .chip{background:rgba(255,255,255,.14);color:#fff}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.arc{width:100%;height:auto;display:block;overflow:visible}
.arc text{font:600 11px var(--sans);fill:var(--hm)}
.sunline{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--hm);font-weight:600;margin-top:2px}
.sun-glow{animation:pulse 3.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}

/* ---- status strip ---- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);border:1px solid var(--line);display:grid;gap:2px;min-width:0}
.kpi b{font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums;color:var(--kc,var(--fg))}
.kpi span{font-size:12px;color:var(--muted)}
.kpi i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* ---- section nav ---- */
.nav{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding:6px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.nav button{font:600 13px var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:99px;padding:6px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .15s,border-color .15s}
.nav button i{width:9px;height:9px;border-radius:50%;background:var(--ac)}
.nav button:hover{transform:translateY(-1px);border-color:var(--ac)}
.nav button:focus-visible,.btn:focus-visible{outline:3px solid var(--ac,var(--c-sky));outline-offset:2px}

/* ---- sections and cards ---- */
.sec{display:grid;gap:14px;scroll-margin-top:60px}
.sec-h{display:flex;align-items:center;gap:12px}
.sec-h h2{font:700 24px/1.1 var(--display);color:var(--ac);letter-spacing:-.005em}
.sec-h .rule{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--ac),transparent)}
.badge{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 16%,var(--panel));color:var(--ac)}
.badge svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:var(--shadow);animation:rise .6s cubic-bezier(.2,.7,.2,1) backwards}
.card.wide{grid-column:1/-1}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.head h3{font:700 17px/1.2 var(--sans)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.today{color:var(--ok)}.old{color:var(--warn)}.none{color:var(--bad)}.link{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.sub{font:700 11.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.chart{position:relative;width:100%;min-height:36px}
.chart svg{display:block;max-width:100%;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--sans)}
.chart .lbl{fill:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:2px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 9px;border-radius:8px;white-space:nowrap;z-index:5;transform:translate(-50%,-115%)}
.tip[hidden]{display:none}
.up{color:var(--up)}.dn{color:var(--dn)}
ul.items{list-style:none;margin:6px 0 0;padding:0}
ul.items li{padding:8px 0;border-bottom:1px solid var(--line);display:grid;gap:3px}
ul.items li:last-child{border-bottom:0}
ul.items .meta{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:7px;color:#fff;background:var(--tc,var(--c-sys))}
.tag.soft{color:var(--fg);background:color-mix(in srgb,var(--tc,var(--c-sys)) 18%,var(--panel));border:1px solid color-mix(in srgb,var(--tc,var(--c-sys)) 40%,var(--line))}
.dis{font-size:12px;color:var(--muted);margin-top:10px}

/* ---- markets ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border-radius:14px;padding:12px;display:grid;gap:3px;min-width:0;background:color-mix(in srgb,var(--tc) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--tc) 30%,var(--line))}
.tile .tt{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tile .tt b{font-size:14px;letter-spacing:.03em}
.tile .age{font-size:11px;color:var(--ok);font-weight:600}
.tile.stale .age{color:var(--warn)}
.tile .px{font:700 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile .ch{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.hcell{border-radius:12px;padding:9px 10px;display:grid;gap:1px;background:color-mix(in srgb,var(--hc) var(--hi),var(--panel));border:1px solid color-mix(in srgb,var(--hc) 35%,var(--line))}
.hcell b{font-size:13px}.hcell .px2{font:700 16px var(--display);font-variant-numeric:tabular-nums}
.hcell small{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.spark{display:block;margin-top:3px}

/* ---- weather ---- */
.wx-now{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wx-t{font:700 54px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--c-sky)}
.wx-d{display:grid;gap:2px}.wx-d b{font-size:17px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-top:12px}
.day{border-radius:14px;padding:9px 6px;text-align:center;display:grid;gap:3px;justify-items:center;background:color-mix(in srgb,var(--c-sky) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--c-sky) 25%,var(--line))}
.day .dn2{font-weight:700;font-size:12.5px}
.day .tmp{font-size:12.5px;font-variant-numeric:tabular-nums}
.rainbar{width:100%;height:5px;border-radius:5px;background:color-mix(in srgb,var(--c-sky) 20%,var(--panel));overflow:hidden}
.rainbar i{display:block;height:100%;background:var(--c-sky);border-radius:5px;transform-origin:left;animation:grow 1s .3s ease-out backwards}
.wx svg{overflow:visible}
.spin{animation:spin 26s linear infinite;transform-origin:50% 50%;transform-box:fill-box}
.dropl{animation:fall 1.1s linear infinite}
.flake{animation:fall 2.4s linear infinite}
.bolt{animation:flash 3s ease-in-out infinite}
.cdrift{animation:cdrift 7s ease-in-out infinite alternate}

/* ---- sky and day ---- */
.moonrow{display:flex;align-items:center;gap:14px}
.moonrow b{font:700 20px var(--display)}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.ring{display:grid;gap:4px;justify-items:center;font-size:12px;color:var(--muted)}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring .trk{stroke:var(--line);fill:none}
.ring .val{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1)}
.ring b{font:700 16px var(--display);color:var(--fg);font-variant-numeric:tabular-nums}
.cds{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.cd{border-radius:14px;padding:12px;background:color-mix(in srgb,var(--cc) 11%,var(--panel));border:1px solid color-mix(in srgb,var(--cc) 30%,var(--line));display:grid;gap:2px}
.cd b{font:700 34px/1 var(--display);color:var(--cc);font-variant-numeric:tabular-nums}
.cd span{font-size:12.5px;font-weight:600}.cd small{color:var(--muted);font-size:11.5px}

/* ---- pause ---- */
.breathe{display:grid;justify-items:center;gap:12px;padding:6px 0}
.orb{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;text-align:center;font:700 15px var(--sans);color:#fff;background:radial-gradient(circle at 35% 30%,#ffb38a,var(--c-rest) 60%,#c2410c);box-shadow:0 0 0 0 color-mix(in srgb,var(--c-rest) 40%,transparent);transition:transform 4s ease-in-out,box-shadow 4s ease-in-out}
.orb.in,.orb.hold1{transform:scale(1.35);box-shadow:0 0 0 22px color-mix(in srgb,var(--c-rest) 18%,transparent)}
.orb.out,.orb.hold2{transform:scale(1)}
.btn{font:700 13px var(--sans);border:0;border-radius:99px;padding:8px 18px;color:#fff;background:var(--c-rest);cursor:pointer}
.btn:hover{filter:brightness(1.08)}

/* ---- system ---- */
.lights{display:grid;gap:2px}
.light{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.light:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--dc)}
.dot.go{animation:ping 2.4s ease-out infinite}
.light .lt{min-width:0}.light .lt b{font-size:14px}.light .lt small{display:block;color:var(--muted);font-size:12px}
.light .lr{font-size:12px;color:var(--muted);text-align:right}
.arch a{display:inline-block;margin:0 12px 6px 0;font-weight:600}
.foot{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;width:100%}td,th{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line)}

/* ---- motion ---- */
@keyframes rise{from{opacity:.35;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drift{from{transform:translateX(-30%)}to{transform:translateX(130%)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.18);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{from{transform:translateY(-6px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
@keyframes flash{0%,86%,100%{opacity:1}90%{opacity:.2}94%{opacity:1}}
@keyframes cdrift{from{transform:translateX(-2px)}to{transform:translateX(3px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--dc) 55%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
@keyframes draw{to{stroke-dashoffset:0}}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.5s .25s cubic-bezier(.4,.1,.2,1) forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}
@media (max-width:640px){.hero-grid{grid-template-columns:1fr}.rings{grid-template-columns:repeat(2,1fr)}.wx-t{font-size:46px}}
</style>
